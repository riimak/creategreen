include:
  - project: devops/ci-template
    ref: v1.4.3
    file: GitlabFlow/Deploy-custom.yml

# Monorepo root for bios-multilevel-platform-services/{dashboard,prediction,blockchain}
variables:
  MONOREPO_TARGET_DIR: bios-multilevel-platform-services

# ─── Dashboard (Deno + ingress) ───
build-dashboard:
  extends: .build
  variables:
    TARGET_APP: dashboard
    # Paths are from repo root (Build V3 uses project root context; Dockerfiles live under monorepo dir)
    DOCKERFILE_PATH: bios-multilevel-platform-services/dashboard/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: dashboard
  rules:
    - !reference [.build, rules]
    - when: on_success

production-dashboard:
  extends: .production
  stage: deploy
  variables:
    TARGET_APP: dashboard
    APPLICATION_IMAGE_NAME_TAG: dashboard
    HELM_RELEASE_PREFIX: bios-dashboard
  environment:
    name: production/dashboard
    url: https://bios-multilevel.barrage.net
  needs:
    - job: build-dashboard
      optional: true
    - job: production-prediction
      optional: true
    - job: production-blockchain
      optional: true
  rules:
    - !reference [.production, rules]
    - when: on_success

# ─── Prediction (Node API) ───
build-prediction:
  extends: .build
  variables:
    TARGET_APP: prediction
    DOCKERFILE_PATH: bios-multilevel-platform-services/prediction/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: prediction
  rules:
    - !reference [.build, rules]
    - when: on_success

production-prediction:
  extends: .production
  stage: deploy
  variables:
    TARGET_APP: prediction
    APPLICATION_IMAGE_NAME_TAG: prediction
    HELM_RELEASE_PREFIX: bios-prediction
  environment:
    name: production/prediction
  needs:
    - job: build-prediction
      optional: true
  # Append GitLab CI variables BIOS_USERNAME / BIOS_PASSWORD to auto-deploy-values.yaml
  # before Helm reads it. kubectl is NOT configured during before_script in
  # barrage-auto-deploy (KUBECONFIG is set up later in the deploy step), so we patch
  # the values file directly instead of creating a Kubernetes Secret.
  before_script:
    - |
      VALUES_FILE="bios-multilevel-platform-services/prediction/.gitlab/auto-deploy-values.yaml"
      if [ -n "${BIOS_USERNAME:-}" ] && [ -n "${BIOS_PASSWORD:-}" ]; then
        {
          echo "  - name: BIOS_USERNAME"
          echo "    value: \"${BIOS_USERNAME}\""
          echo "  - name: BIOS_PASSWORD"
          echo "    value: \"${BIOS_PASSWORD}\""
        } >> "${VALUES_FILE}"
        echo "Appended BIOS_USERNAME/BIOS_PASSWORD from CI variables to ${VALUES_FILE}"
      else
        echo "WARN: BIOS_USERNAME/BIOS_PASSWORD not set as CI variables; Mars2 ingest will be OFF."
      fi
  rules:
    - !reference [.production, rules]
    - when: on_success

# ─── Blockchain (Node API) ───
build-blockchain:
  extends: .build
  variables:
    TARGET_APP: blockchain
    DOCKERFILE_PATH: bios-multilevel-platform-services/blockchain/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: blockchain
  rules:
    - !reference [.build, rules]
    - when: on_success

production-blockchain:
  extends: .production
  stage: deploy
  variables:
    TARGET_APP: blockchain
    APPLICATION_IMAGE_NAME_TAG: blockchain
    HELM_RELEASE_PREFIX: bios-blockchain
  environment:
    name: production/blockchain
  needs:
    - job: build-blockchain
      optional: true
  # Append Stealth secrets from GitLab CI variables to auto-deploy-values.yaml.
  # Only STEALTH_WIF is strictly required for real broadcast; the *_USERNAME/PASSWORD/API_KEY
  # are only used if the Stealth RPC gateway requires authentication.
  before_script:
    - |
      VALUES_FILE="bios-multilevel-platform-services/blockchain/.gitlab/auto-deploy-values.yaml"
      append_env() {
        local name="$1"; local value="$2"
        if [ -n "${value}" ]; then
          {
            echo "  - name: ${name}"
            echo "    value: \"${value}\""
          } >> "${VALUES_FILE}"
          echo "Appended ${name} from CI variables to ${VALUES_FILE}"
        fi
      }
      if [ -n "${STEALTH_WIF:-}" ]; then
        append_env STEALTH_WIF "${STEALTH_WIF}"
      else
        echo "WARN: STEALTH_WIF not set; blockchain will not be able to broadcast real Stealth transactions."
      fi
      append_env STEALTH_RPC_USERNAME "${STEALTH_RPC_USERNAME:-}"
      append_env STEALTH_RPC_PASSWORD "${STEALTH_RPC_PASSWORD:-}"
      append_env STEALTH_API_KEY      "${STEALTH_API_KEY:-}"
  rules:
    - !reference [.production, rules]
    - when: on_success
