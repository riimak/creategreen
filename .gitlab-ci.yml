include:
  - project: devops/ci-template
    ref: v1.4.3
    file: GitlabFlow/Deploy-custom.yml

# Monorepo root for bios-multilevel-platform-services/{dashboard,prediction,blockchain}
# All production deploy jobs share one resource group so they never run in parallel.
# Parallel helm upgrades were stressing admission webhooks (e.g. Kyverno) and failing;
# the same jobs succeed when run one after another.
variables:
  MONOREPO_TARGET_DIR: bios-multilevel-platform-services

# ─── Dashboard (Deno + ingress) ───
build-dashboard:
  extends: .build
  variables:
    TARGET_APP: dashboard
    # Paths are from repo root (Build V3 uses project root context; Dockerfiles live under monorepo dir)
    DOCKERFILE_PATH: bios-multilevel-platform-services/dashboard/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: dashboard
  rules:
    - !reference [.build, rules]
    - when: on_success

production-dashboard:
  extends: .production
  stage: deploy
  resource_group: bios-multilevel-production
  variables:
    TARGET_APP: dashboard
    APPLICATION_IMAGE_NAME_TAG: dashboard
    HELM_RELEASE_PREFIX: bios-dashboard
  environment:
    name: production/dashboard
    url: https://bios-multilevel.barrage.net
  needs:
    - job: build-dashboard
      optional: true
    - job: production-prediction
      optional: true
    - job: production-blockchain
      optional: true
    - job: production-fusionsolar
      optional: true
  rules:
    - !reference [.production, rules]
    - when: on_success

# ─── Prediction (Node API) ───
build-prediction:
  extends: .build
  variables:
    TARGET_APP: prediction
    DOCKERFILE_PATH: bios-multilevel-platform-services/prediction/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: prediction
  rules:
    - !reference [.build, rules]
    - when: on_success

production-prediction:
  extends: .production
  stage: deploy
  resource_group: bios-multilevel-production
  variables:
    TARGET_APP: prediction
    APPLICATION_IMAGE_NAME_TAG: prediction
    HELM_RELEASE_PREFIX: bios-prediction
  environment:
    name: production/prediction
  needs:
    - job: build-prediction
      optional: true
  # Forward GitLab CI/CD variables into Helm `extraEnv`.
  # For each CI variable that is set, we DELETE any existing entry with the same `name:`
  # from auto-deploy-values.yaml first, then append — so there are never duplicate names
  # (Kubernetes strategic merge patch rejects duplicate env entries).
  before_script:
    - |
      set -e
      VALUES_FILE="bios-multilevel-platform-services/prediction/.gitlab/auto-deploy-values.yaml"
      PREDICTION_FORWARD_ENVS="\
        BIOS_API_BASE BIOS_USERNAME BIOS_PASSWORD \
        PREDICTION_INTERVAL_MINUTES PREDICTION_TARGETS PREDICTION_STATIONS \
        PREDICTION_INIT_MODE PREDICTION_BACKFILL_HOURS \
        PREDICTION_EXPECTED_SAMPLE_MINUTES PREDICTION_MIN_SAMPLES \
        PREDICTION_STALE_AFTER_MINUTES PREDICTION_MISSING_RATIO_WARN \
        PREDICTION_DATA_API_BASE WEATHER_API_BASE WEATHER_API_KEY \
        SLA_TARGET_PERCENT NOTIFICATIONS_ENABLED NOTIFICATION_WEBHOOK_URL \
        NOTIFICATION_STALE_AFTER_MINUTES NOTIFICATION_REPEAT_AFTER_MINUTES"
      for name in $PREDICTION_FORWARD_ENVS; do
        value="${!name:-}"
        if [ -n "$value" ]; then
          sed -i "/^  - name: ${name}$/,+1d" "$VALUES_FILE"
          {
            echo "  - name: $name"
            echo "    value: \"$value\""
          } >> "$VALUES_FILE"
          echo "Forwarded CI var $name -> $VALUES_FILE"
        else
          echo "Skip $name: not set as CI variable"
        fi
      done
      if [ -z "${BIOS_USERNAME:-}" ] || [ -z "${BIOS_PASSWORD:-}" ]; then
        echo "WARN: BIOS_USERNAME/BIOS_PASSWORD not set as CI variables; Mars2 ingest will be OFF."
      fi
  rules:
    - !reference [.production, rules]
    - when: on_success

# ─── FusionSolar (Node API, internal only) ───
build-fusionsolar:
  extends: .build
  variables:
    TARGET_APP: fusionsolar
    DOCKERFILE_PATH: bios-multilevel-platform-services/fusionsolar/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: fusionsolar
  rules:
    - !reference [.build, rules]
    - when: on_success

production-fusionsolar:
  extends: .production
  stage: deploy
  resource_group: bios-multilevel-production
  variables:
    TARGET_APP: fusionsolar
    APPLICATION_IMAGE_NAME_TAG: fusionsolar
    HELM_RELEASE_PREFIX: bios-fusionsolar
  environment:
    name: production/fusionsolar
  needs:
    - job: build-fusionsolar
      optional: true
  before_script:
    - |
      set -e
      VALUES_FILE="bios-multilevel-platform-services/fusionsolar/.gitlab/auto-deploy-values.yaml"
      FUSIONSOLAR_FORWARD_ENVS="\
        FUSIONSOLAR_CLIENT_ID FUSIONSOLAR_CLIENT_SECRET \
        FUSIONSOLAR_SETUP_TOKEN FUSIONSOLAR_TOKEN_ENCRYPTION_KEY \
        FUSIONSOLAR_API_BASE_URL FUSIONSOLAR_OAUTH_BASE_URL \
        FUSIONSOLAR_REDIRECT_URI FUSIONSOLAR_LIVE_INTERVAL_SECONDS \
        FUSIONSOLAR_INVENTORY_INTERVAL_SECONDS FUSIONSOLAR_REQUEST_TIMEOUT_SECONDS \
        FUSIONSOLAR_BACKFILL_ENABLED"
      for name in $FUSIONSOLAR_FORWARD_ENVS; do
        value="${!name:-}"
        if [ -n "$value" ]; then
          sed -i "/^  - name: ${name}$/,+1d" "$VALUES_FILE"
          {
            echo "  - name: $name"
            echo "    value: \"$value\""
          } >> "$VALUES_FILE"
          echo "Forwarded CI variable $name"
        else
          echo "Skipped CI variable $name: not set"
        fi
      done
  rules:
    - !reference [.production, rules]
    - when: on_success

# ─── Blockchain (Node API) ───
build-blockchain:
  extends: .build
  variables:
    TARGET_APP: blockchain
    DOCKERFILE_PATH: bios-multilevel-platform-services/blockchain/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: blockchain
  rules:
    - !reference [.build, rules]
    - when: on_success

production-blockchain:
  extends: .production
  stage: deploy
  resource_group: bios-multilevel-production
  variables:
    TARGET_APP: blockchain
    APPLICATION_IMAGE_NAME_TAG: blockchain
    HELM_RELEASE_PREFIX: bios-blockchain
  environment:
    name: production/blockchain
  needs:
    - job: build-blockchain
      optional: true
  # Forward GitLab CI/CD variables (Stealth secrets + tunables) into Helm `extraEnv`.
  # For each CI variable that is set, we DELETE any existing entry with the same `name:`
  # from auto-deploy-values.yaml first, then append — so there are never duplicate names
  # (Kubernetes strategic merge patch rejects duplicate env entries).
  before_script:
    - |
      set -e
      VALUES_FILE="bios-multilevel-platform-services/blockchain/.gitlab/auto-deploy-values.yaml"
      # STEALTH_WIF is still forwarded as `extraEnv` for backward compatibility:
      # removing it here would leave the pod with no WIF until the operator has
      # created the `bios-stealth-wif` Kubernetes Secret out of band, which would
      # break real Stealth broadcasts in the meantime.
      #
      # MIGRATION (one-time, by an operator with kubectl access):
      #   1. Provision the Secret (see deploy/secret-stealth-wif.example.yaml
      #      and the steps in blockchain/README.md).
      #   2. Verify the chart picks it up: the pod will have STEALTH_WIF_FILE
      #      pointing at /etc/secrets/stealth/wif, and the wallet logs will
      #      show `walletConfigured: true` even without STEALTH_WIF in env.
      #   3. Remove STEALTH_WIF from the GitLab CI/CD variables (or unset it
      #      via `Protected/Masked` toggle). On the next deploy this script
      #      will skip it, no `extraEnv` row will be written, and the WIF
      #      will exist only in the Kubernetes Secret.
      #
      # The wallet code prefers env over file, so during the migration window
      # both paths produce the same result; afterwards only the Secret remains.
      BLOCKCHAIN_FORWARD_ENVS="\
        STEALTH_WIF STEALTH_RPC_USERNAME STEALTH_RPC_PASSWORD STEALTH_API_KEY \
        STEALTH_RELAY_MODE STEALTH_RPC_URL STEALTH_RPC_ID \
        STEALTH_ENABLE_REAL_BROADCAST STEALTH_RPC_COOLDOWN_SECONDS \
        STEALTH_RPC_STATUS_METHOD STEALTH_RPC_BALANCE_METHOD \
        STEALTH_RPC_OUTPUTS_METHOD STEALTH_RPC_TX_METHOD \
        STEALTH_RPC_BLOCK_METHOD STEALTH_RPC_BEST_BLOCK_METHOD \
        STEALTH_RPC_SEND_METHOD STEALTH_RAW_TX_BUILDER_URL \
        STEALTH_FEEWORK_TIMEOUT_SECONDS \
        BLOCKCHAIN_EVENT_FILTERS BLOCKCHAIN_EVENT_SOURCE BLOCKCHAIN_EVENT_SCHEMA \
        BLOCKCHAIN_INTERVAL_SECONDS BLOCKCHAIN_RECONFIRM_SECONDS \
        BLOCKCHAIN_MAX_RETRIES BLOCKCHAIN_INIT_MODE BLOCKCHAIN_RETENTION_COUNT \
        BLOCKCHAIN_MAX_BROADCASTS_PER_CYCLE BLOCKCHAIN_ANCHOR_PREDICTIONS BLOCKCHAIN_ANCHOR_ANOMALIES \
        BLOCKCHAIN_DEMO_DEVICES BLOCKCHAIN_SHOW_VENDOR_WARNINGS \
        BLOCKCHAIN_WALLET_SEED BLOCKCHAIN_WALLET_SEED_STRICT BLOCKCHAIN_AMQP_MODE"
      for name in $BLOCKCHAIN_FORWARD_ENVS; do
        value="${!name:-}"
        if [ -n "$value" ]; then
          sed -i "/^  - name: ${name}$/,+1d" "$VALUES_FILE"
          {
            echo "  - name: $name"
            echo "    value: \"$value\""
          } >> "$VALUES_FILE"
          if [ "$name" = "STEALTH_WIF" ]; then
            # Don't echo the WIF value — only that it was forwarded.
            echo "Forwarded CI var STEALTH_WIF -> $VALUES_FILE (consider migrating to bios-stealth-wif Secret)"
          else
            echo "Forwarded CI var $name -> $VALUES_FILE"
          fi
        else
          echo "Skip $name: not set as CI variable"
        fi
      done
      # Optional: override Barrage-internal VIP in hostAliases (default 172.21.239.244 in values file).
      if [ -n "${STEALTH_GATEWAY_MAINNET_INTERNAL_IP:-}" ]; then
        sed -i "s/172\\.21\\.239\\.244/${STEALTH_GATEWAY_MAINNET_INTERNAL_IP}/g" "$VALUES_FILE"
        echo "Patched hostAliases IP to ${STEALTH_GATEWAY_MAINNET_INTERNAL_IP} in ${VALUES_FILE}"
      fi
      if [ -z "${STEALTH_WIF:-}" ]; then
        echo "INFO: STEALTH_WIF not set as a CI variable; expecting the bios-stealth-wif Kubernetes Secret to provide it via STEALTH_WIF_FILE."
      fi
  rules:
    - !reference [.production, rules]
    - when: on_success
