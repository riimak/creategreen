include:
  - project: devops/ci-template
    ref: v1.4.3
    file: GitlabFlow/Deploy-custom.yml

# Monorepo root for bios-multilevel-platform-services/{dashboard,prediction,blockchain}
# All production deploy jobs share one resource group so they never run in parallel.
# Parallel helm upgrades were stressing admission webhooks (e.g. Kyverno) and failing;
# the same jobs succeed when run one after another.
variables:
  MONOREPO_TARGET_DIR: bios-multilevel-platform-services

# ─── External uptime probe ───
# The in-cluster monitor cannot see the dashboard itself being down. This job
# runs on a GitLab *schedule* (CI/CD > Schedules: cron "*/5 * * * *", branch
# production, variable UPTIME_PROBE=true) from the GitLab runner, i.e. outside
# the cluster, and is the measurement behind the 99.9 % availability SLO.
# State (last verdict, history) lives in the job cache so Slack is only told
# about transitions; the job itself fails while the site is down so the
# pipeline list doubles as an incident log. Every other job in this file is
# excluded from schedule pipelines.
uptime-probe:
  stage: .post
  # alpine/curl runs as root, so the cache directory in the checkout is writable.
  image: alpine/curl:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $UPTIME_PROBE == "true"
  cache:
    key: uptime-probe-state
    paths: [.uptime/]
  artifacts:
    when: always
    expire_in: 14 days
    paths: [.uptime/history.csv]
  variables:
    GIT_DEPTH: "1"
  script:
    - |
      set -u
      BASE="${UPTIME_BASE_URL:-https://bios-multilevel.barrage.net}"
      CA="certs/bipa_ca.crt"
      mkdir -p .uptime
      touch .uptime/history.csv
      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      fail=""
      detail=""
      probe() { # name path expected-substring
        local name="$1" path="$2" expect="$3" code body ms
        body="$(curl -sS --cacert "$CA" --max-time 15 -w '\n%{http_code} %{time_total}' "$BASE$path" 2>&1)" || body="$(printf '%s\n000 15' "$body")"
        code="$(printf '%s' "$body" | tail -n1 | cut -d' ' -f1)"
        ms="$(printf '%s' "$body" | tail -n1 | cut -d' ' -f2 | awk '{printf "%d", $1*1000}')"
        body="$(printf '%s' "$body" | sed '$d')"
        if [ "$code" = "200" ] && { [ -z "$expect" ] || printf '%s' "$body" | grep -q -- "$expect"; }; then
          echo "ok    $name  HTTP $code  ${ms}ms"
          detail="$detail$name=ok(${ms}ms) "
        else
          echo "FAIL  $name  HTTP $code  ${ms}ms  $(printf '%s' "$body" | head -c 160 | tr '\n' ' ')"
          fail="$fail$name "
          detail="$detail$name=FAIL(HTTP $code) "
        fi
      }
      probe "page"      "/"                      "<html"
      probe "health"    "/health"                '"ok": true'
      probe "status"    "/prediction/status"     '"lifecycle"'
      probe "freshness" "/prediction/freshness"  '"checkedAt"'
      verdict="up"; [ -n "$fail" ] && verdict="down"
      previous="$(cat .uptime/last-verdict 2>/dev/null || echo unknown)"
      echo "$now,$verdict,$(printf '%s' "$detail" | sed 's/[[:space:]]*$//')" >> .uptime/history.csv
      tail -n 20000 .uptime/history.csv > .uptime/history.tmp && mv .uptime/history.tmp .uptime/history.csv
      echo "$verdict" > .uptime/last-verdict
      total="$(wc -l < .uptime/history.csv)"; ups="$(grep -c ',up,' .uptime/history.csv || true)"
      echo "verdict=$verdict previous=$previous history=$total runs, up=$ups"
      if [ "$verdict" != "$previous" ] && [ -n "${SLACK_WEBHOOK_URL:-}" ] && [ "$previous" != "unknown" -o "$verdict" = "down" ]; then
        if [ "$verdict" = "down" ]; then
          text=":rotating_light: *BIOS Multi-level — public site DOWN* (external probe) — failed: ${fail}— ${detail}\n$BASE"
        else
          text=":large_green_circle: *BIOS Multi-level — public site back UP* (external probe) — ${detail}\n$BASE"
        fi
        printf '{"text":"%s"}' "$text" | curl -sS --max-time 10 -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" >/dev/null || echo "slack post failed"
      fi
      [ "$verdict" = "up" ]

# ─── Dashboard (Deno + ingress) ───
build-dashboard:
  extends: .build
  variables:
    TARGET_APP: dashboard
    # Paths are from repo root (Build V3 uses project root context; Dockerfiles live under monorepo dir)
    DOCKERFILE_PATH: bios-multilevel-platform-services/dashboard/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: dashboard
  rules:
    # Scheduled pipelines only run the uptime probe, never a build or deploy.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - !reference [.build, rules]
    - when: on_success

production-dashboard:
  extends: .production
  stage: deploy
  resource_group: bios-multilevel-production
  # The cluster's etcd loses its leader several times an hour; a single
  # failed kubectl/helm call inside the job otherwise kills the whole rollout
  # and skips every job that depends on it (the dashboard is last).
  retry:
    max: 2
    when: [script_failure, api_failure, runner_system_failure, stuck_or_timeout_failure, unknown_failure]
  variables:
    TARGET_APP: dashboard
    APPLICATION_IMAGE_NAME_TAG: dashboard
    HELM_RELEASE_PREFIX: bios-dashboard
    # barrage-auto-deploy passes --set replicaCount=$REPLICAS (default 1) over
    # the values file; two replicas across nodes, see dashboard/README.md.
    REPLICAS: "2"
  environment:
    name: production/dashboard
    url: https://bios-multilevel.barrage.net
  needs:
    - job: build-dashboard
      optional: true
    - job: production-prediction
      optional: true
    - job: production-blockchain
      optional: true
    - job: production-fusionsolar
      optional: true
    - job: production-soliscloud
      optional: true
  # Slack alerting for the data-flow health monitor (dashboard/monitor.ts).
  # SLACK_WEBHOOK_URL is a masked GitLab CI/CD variable; forward-env.sh only
  # prints variable names, never values.
  before_script:
    - |
      set -e
      VALUES_FILE="bios-multilevel-platform-services/dashboard/.gitlab/auto-deploy-values.yaml"
      DASHBOARD_FORWARD_ENVS="\
        SLACK_WEBHOOK_URL ALERT_CHECK_SECONDS ALERT_UPSTREAM_FAILURES \
        ALERT_CYCLE_STALE_MINUTES ALERT_DATA_STALE_MINUTES ALERT_DATA_STALE_MINUTES_SOLAR \
        ALERT_REPEAT_MINUTES ALERT_STARTUP_GRACE_SECONDS ALERT_SEND_STARTUP_MESSAGE \
        ALERT_DB_PROBE_TIMEOUT_MS ALERT_FEED_SILENT_MINUTES ALERT_ENV_LABEL DASHBOARD_PUBLIC_URL \
        SLO_AVAILABILITY_PERCENT SLO_FRESHNESS_PERCENT SLO_READ_P95_MS DASHBOARD_STALE_MAX_MINUTES"
      bash bios-multilevel-platform-services/fusionsolar/.gitlab/forward-env.sh \
        "$VALUES_FILE" $DASHBOARD_FORWARD_ENVS
      if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
        echo "WARN: SLACK_WEBHOOK_URL not set as a CI variable; the health monitor runs (GET /monitor) but sends no Slack alerts."
      fi
  rules:
    # Scheduled pipelines only run the uptime probe, never a build or deploy.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - !reference [.production, rules]
    - when: on_success

# ─── Prediction (Node API) ───
build-prediction:
  extends: .build
  variables:
    TARGET_APP: prediction
    DOCKERFILE_PATH: bios-multilevel-platform-services/prediction/Dockerfile
    APPLICATION_IMAGE_NAME_TAG: prediction
  rules:
    # Scheduled pipelines only run the uptime probe, never a build or deploy.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - !reference [.build, rules]
    - when: on_success

production-prediction:
  extends: .production
  stage: deploy
  resource_group: bios-multilevel-production
  # The cluster's etcd loses its leader several times an hour; a single
  # failed kubectl/helm call inside the job otherwise kills the whole rollout
  # and skips every job that depends on it (the dashboard is last).
  retry:
    max: 2
    when: [script_failure, api_failure, runner_system_failure, stuck_or_timeout_failure, unknown_failure]
  variables:
    TARGET_APP: prediction
    APPLICATION_IMAGE_NAME_TAG: prediction
    HELM_RELEASE_PREFIX: bios-prediction
    # Two replicas; the scheduler leader is elected with a PostgreSQL advisory lock.
    REPLICAS: "2"
  environment:
    name: production/prediction
  needs:
    - job: build-prediction
      optional: true
  # Forward GitLab CI/CD variables into Helm `extraEnv`.
  # For each CI variable that is set, we DELETE any existing entry with the same `name:`
  # from auto-deploy-values.yaml first, then append — so there are never duplicate names
  # (Kubernetes strategic merge patch rejects duplicate env entries).
  before_script:
    - |
      set -e
      VALUES_FILE="bios-multilevel-platform-services/prediction/.gitlab/auto-deploy-values.yaml"
      PREDICTION_FORWARD_ENVS="\
        BIOS_API_BASE BIOS_USERNAME BIOS_PASSWORD \
        PREDICTION_INTERVAL_MINUTES PREDICTION_TARGETS PREDICTION_STATIONS \
        PREDICTION_INIT_MODE PREDICTION_BACKFILL_HOURS \
        PREDICTION_EXPECTED_SAMPLE_MINUTES PREDICTION_MIN_SAMPLES \
        PREDICTION_STALE_AFTER_MINUTES PREDICTION_MISSING_RATIO_WARN \
        PREDICTION_DATA_API_BASE WEATHER_API_BASE WEATHER_API_KEY \
        SLA_TARGET_PERCENT NOTIFICATIONS_ENABLED NOTIFICATION_WEBHOOK_URL \
        NOTIFICATION_STALE_AFTER_MINUTES NOTIFICATION_REPEAT_AFTER_MINUTES \
        FEED_PLANTS FEED_USERNAME FEED_PASSWORD FEED_API_KEY FEED_TOKEN_SECRET \
        FEED_STALE_MINUTES FEED_STALE_MINUTES_COUNTERS"
      for name in $PREDICTION_FORWARD_ENVS; do
        value="${!name:-}"
        if [ -n "$value" ]; then
          sed -i "/^  - name: ${name}$/,+1d" "$VALUES_FILE"
          {
            echo "  - name: $name"
            echo "    value: \"$value\""
          } >> "$VALUES_FILE"
          echo "Forwarded CI var $name -> $VALUES_FILE"
        else
          echo "Skip $name: not set as CI variable"
        fi
      done
      if [ -z "${BIOS_USERNAME:-}" ] || [ -z "${BIOS_PASSWORD:-}" ]; then
        echo "WARN: BIOS_USERNAME/BIOS_PASSWORD not set as CI variables; Mars2 ingest will be OFF."
      fi
      if { [ -z "${FEED_USERNAME:-}" ] || [ -z "${FEED_PASSWORD:-}" ]; } && [ -z "${FEED_API_KEY:-}" ]; then
        echo "WARN: FEED_USERNAME/FEED_PASSWORD (or FEED_API_KEY) not set; the Mars2 feed API answers 503 until they are."
      fi
  rules:
    # Scheduled pipelines only run the uptime probe, never a build or deploy.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - !reference [.production, rules]
    - when: on_success

