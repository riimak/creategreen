# =============================================================================
# BIOS Multi-level Platform — Default Helm Values (all environments)
# =============================================================================
replicaCount: 1
strategyType: "RollingUpdate"

image:
  repository: git.barrage.net/bios-multilevel/bios-multilevel-dashboard
  tag: stable
  pullPolicy: IfNotPresent
  secrets:
    - name: gitlab-registry-bios-multilevel-bios-multilevel-dashboard

application:
  track: stable
  tier: app

barrage:
  vault:
    create: false

service:
  enabled: true
  name: bios-mlevel
  type: ClusterIP
  externalPort: 8000
  internalPort: 8000

ingress:
  enabled: true
  path: "/"
  tls:
    enabled: true
    acme: true
    secretName: ""
    useDefaultSecret: false

livenessProbe:
  path: "/health"
  initialDelaySeconds: 15
  timeoutSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"
  httpHeaders: []

readinessProbe:
  path: "/health"
  initialDelaySeconds: 5
  timeoutSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"
  httpHeaders: []

startupProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30
  periodSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"
  httpHeaders: []

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

postgresql:
  managed: false

persistence:
  enabled: false

# Mount the PG CA cert from a K8s Secret so pg connects with verify-ca.
# Create the secret once:
#   kubectl create secret generic bios-pg-ca \
#     --namespace=bios-multilevel-production \
#     --from-file=ca.crt=/path/to/ca.crt
extraVolumes:
  - name: pg-ca
    secret:
      secretName: bios-pg-ca
      optional: true
extraVolumeMounts:
  - name: pg-ca
    mountPath: /etc/ssl/pg
    readOnly: true

serviceAccount:
  name: bios-multilevel-sa
  annotations: {}
  createNew: true

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

# =============================================================================
# Environment — no Vault, secrets injected from GitLab CI/CD variables
# via K8s Secret (created by the ci-template deploy job)
# =============================================================================
extraEnv:
  # Dashboard config
  # Service DNS: {HELM_RELEASE_PREFIX}-production-{worker-name}
  - name: PREDICTION_SERVICE_URL
    value: "http://bios-multilevel-production-prediction:8000"
  - name: BLOCKCHAIN_SERVICE_URL
    value: "http://bios-multilevel-production-blockchain:8000"
  # PG TLS: point to the mounted CA cert
  - name: DATABASE_CA_FILE
    value: "/etc/ssl/pg/ca.crt"
  - name: DASHBOARD_EVENT_POLL_SECONDS
    value: "3"

# =============================================================================
# Workers — prediction service + blockchain service (same image, different cmds)
# =============================================================================
workers:
  prediction:
    replicaCount: 1
    command:
      - node
      - prediction/server.js
    livenessProbe:
      path: "/health"
      initialDelaySeconds: 15
      timeoutSeconds: 5
      scheme: "HTTP"
      probeType: "httpGet"
    readinessProbe:
      path: "/health"
      initialDelaySeconds: 5
      timeoutSeconds: 5
      scheme: "HTTP"
      probeType: "httpGet"
    extraEnv:
      - name: PREDICTION_PORT
        value: "8000"
      - name: PREDICTION_INTERVAL_MINUTES
        value: "10"
      - name: PREDICTION_TARGETS
        value: "auto"
      - name: PREDICTION_STATIONS
        value: "OS1BIOS,OS2BIOS,SOLAXBIOS"
      - name: PREDICTION_INIT_MODE
        value: "resume"
      - name: PREDICTION_BACKFILL_HOURS
        value: "72"
      - name: PREDICTION_EXPECTED_SAMPLE_MINUTES
        value: "10"
      - name: PREDICTION_MIN_SAMPLES
        value: "6"
      - name: PREDICTION_STALE_AFTER_MINUTES
        value: "30"
      - name: PREDICTION_MISSING_RATIO_WARN
        value: "0.3"
      - name: SLA_TARGET_PERCENT
        value: "95"
      - name: DATABASE_CA_FILE
        value: "/etc/ssl/pg/ca.crt"
      # DATABASE_URL, BIOS_API_BASE, BIOS_USERNAME, BIOS_PASSWORD
      # injected from GitLab CI/CD secret variables via K8s Secret
    extraVolumes:
      - name: pg-ca
        secret:
          secretName: bios-pg-ca
          optional: true
    extraVolumeMounts:
      - name: pg-ca
        mountPath: /etc/ssl/pg
        readOnly: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  blockchain:
    replicaCount: 1
    command:
      - node
      - blockchain/server.js
    livenessProbe:
      path: "/health"
      initialDelaySeconds: 20
      timeoutSeconds: 5
      scheme: "HTTP"
      probeType: "httpGet"
    readinessProbe:
      path: "/health"
      initialDelaySeconds: 10
      timeoutSeconds: 5
      scheme: "HTTP"
      probeType: "httpGet"
    extraEnv:
      - name: BLOCKCHAIN_PORT
        value: "8000"
      - name: PREDICTION_SERVICE_URL
        value: "http://bios-multilevel-production-prediction:8000"
      - name: BLOCKCHAIN_INTERVAL_SECONDS
        value: "10"
      - name: BLOCKCHAIN_RECONFIRM_SECONDS
        value: "20"
      - name: BLOCKCHAIN_EVENT_SOURCE
        value: "prediction"
      - name: BLOCKCHAIN_EVENT_SCHEMA
        value: "v2"
      - name: BLOCKCHAIN_MAX_BROADCASTS_PER_CYCLE
        value: "3"
      - name: BLOCKCHAIN_MAX_RETRIES
        value: "3"
      - name: BLOCKCHAIN_INIT_MODE
        value: "resume"
      - name: BLOCKCHAIN_RETENTION_COUNT
        value: "5000"
      - name: STEALTH_RELAY_MODE
        value: "json-rpc"
      - name: STEALTH_RPC_URL
        value: "https://api-gateway-mainnet.stealthmonitor.xyz"
      - name: STEALTH_RPC_ID
        value: "666420"
      - name: STEALTH_ENABLE_REAL_BROADCAST
        value: "true"
      - name: STEALTH_RPC_COOLDOWN_SECONDS
        value: "30"
      - name: DATABASE_CA_FILE
        value: "/etc/ssl/pg/ca.crt"
      # DATABASE_URL, STEALTH_WIF injected from GitLab CI/CD secret variables
    extraVolumes:
      - name: pg-ca
        secret:
          secretName: bios-pg-ca
          optional: true
    extraVolumeMounts:
      - name: pg-ca
        mountPath: /etc/ssl/pg
        readOnly: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
