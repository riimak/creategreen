# Dashboard — Deno HTTP + ingress (operations UI).
# See template: devops/ci-template monorepo (.gitlab per app under MONOREPO_TARGET_DIR).
# Two replicas on different nodes: a node loss or a pod reschedule no longer
# takes the public site down (one replica was a 5-6 minute outage per node
# failure). Only the lease holder posts Slack alerts (main.ts).
replicaCount: 2
strategyType: "RollingUpdate"
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app: bios-dashboard-production

image:
  repository: git.barrage.net/bios-multilevel/bios-multilevel-dashboard
  tag: stable
  pullPolicy: IfNotPresent
  secrets:
    # CI job token: valid only while the deploy job runs, so a pod rescheduled
    # later cannot pull with it. The deploy-token secret below is created once
    # by hand from a GitLab deploy token with read_registry (see
    # docs/runbook-production.md) and keeps pulls working between pipelines.
    - name: gitlab-registry-bios-multilevel-bios-multilevel-dashboard
    - name: bios-registry-deploy-token

application:
  track: stable
  tier: app

barrage:
  vault:
    create: false

service:
  enabled: true
  name: bios-mlevel
  type: ClusterIP
  externalPort: 8000
  internalPort: 8000

ingress:
  enabled: true
  path: "/"
  # Required for cert-manager to create the TLS secret (avoids "failed to determine issuer" on the ingress).
  # Must match a ClusterIssuer in the cluster: kubectl get clusterissuer
  annotations:
    cert-manager.io/cluster-issuer: barrage-prod
  tls:
    enabled: true
    acme: true
    secretName: ""
    useDefaultSecret: false

livenessProbe:
  path: "/health"
  initialDelaySeconds: 15
  timeoutSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"
  httpHeaders: []

readinessProbe:
  path: "/health"
  initialDelaySeconds: 5
  timeoutSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"
  httpHeaders: []

startupProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30
  periodSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"
  httpHeaders: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

postgresql:
  managed: false

persistence:
  enabled: false

serviceAccount:
  name: bios-multilevel-sa
  annotations: {}
  createNew: true

# Keep one replica during node drains and voluntary evictions.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false

# Upstream APIs (same K8s namespace). Hostnames must match `kubectl get svc` (e.g. …-barrage-autodeploy).
extraEnv:
  - name: PREDICTION_SERVICE_URL
    value: "http://bios-prediction-production-barrage-autodeploy:8091"
  - name: BLOCKCHAIN_SERVICE_URL
    value: "http://bios-blockchain-production-barrage-autodeploy:8092"
  - name: FUSIONSOLAR_SERVICE_URL
    value: "http://bios-fusionsolar-production-barrage-autodeploy:8093"
  - name: DASHBOARD_EVENT_POLL_SECONDS
    value: "3"
  # Data-flow health monitor (dashboard/monitor.ts). SLACK_WEBHOOK_URL and the
  # ALERT_* tunables are appended from GitLab CI/CD variables by the
  # production-dashboard job; these are the non-secret defaults.
  - name: DASHBOARD_PUBLIC_URL
    value: "https://bios-multilevel.barrage.net"
  - name: ALERT_ENV_LABEL
    value: "production"
