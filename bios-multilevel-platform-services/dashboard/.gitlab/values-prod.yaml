# Production overrides — merged per Barrage DEPLOY_* / HELM_UPGRADE_EXTRA_ARGS pattern
# cert-manager issuer: set in auto-deploy-values.yaml (ingress.annotations.cert-manager.io/cluster-issuer).
replicaCount: 1

ingress:
  annotations:
    cert-manager.io/cluster-issuer: barrage-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
