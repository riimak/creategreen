# bios-stealth-wif — example Kubernetes Secret manifest
#
# This Secret is what the blockchain pod mounts at /etc/secrets/stealth/wif
# (see blockchain/.gitlab/auto-deploy-values.yaml). Once it exists in the
# namespace, the blockchain wallet code reads the WIF from the file and the
# operator can stop forwarding STEALTH_WIF as a plain Helm `extraEnv` value.
#
# DO NOT commit a real WIF to git. This file is an example template only;
# create the real Secret out of band with one of the methods below.
#
# ── Method 1: imperative, one shot, no manifest on disk ─────────────────────
#   kubectl -n <namespace> create secret generic bios-stealth-wif \
#     --from-literal=wif='<paste WIF here>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# ── Method 2: from a local file (so the WIF never appears in shell history) ─
#   printf '%s' '<paste WIF here>' > /tmp/wif && \
#     kubectl -n <namespace> create secret generic bios-stealth-wif \
#       --from-file=wif=/tmp/wif --dry-run=client -o yaml | kubectl apply -f - && \
#     shred -u /tmp/wif
#
# ── Method 3: edit a copy of this manifest ────────────────────────────────-
#   cp secret-stealth-wif.example.yaml /tmp/secret.yaml
#   # edit /tmp/secret.yaml and replace REPLACE_WITH_BASE64_WIF with
#   #   $(printf '%s' '<wif>' | base64 | tr -d '\n')
#   kubectl -n <namespace> apply --server-side -f /tmp/secret.yaml
#   shred -u /tmp/secret.yaml
#
# After the Secret exists, on the next deploy:
#   - Confirm the pod logs `walletConfigured: true` even with STEALTH_WIF
#     unset in the env (you can verify with `kubectl describe pod` — it
#     should show STEALTH_WIF_FILE but NOT STEALTH_WIF).
#   - Then unset STEALTH_WIF in GitLab CI variables. From then on the WIF
#     lives only in this Secret.
---
apiVersion: v1
kind: Secret
metadata:
  name: bios-stealth-wif
  # namespace is intentionally omitted — set it on the kubectl command line
  # with `-n <namespace>` so this template is reusable across environments.
  labels:
    app.kubernetes.io/part-of: bios-multilevel
    app.kubernetes.io/component: blockchain
type: Opaque
data:
  wif: REPLACE_WITH_BASE64_WIF
