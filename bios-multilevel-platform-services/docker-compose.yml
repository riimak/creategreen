services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bios}"
      POSTGRES_USER: "${POSTGRES_USER:-bios}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bios}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  prediction:
    build:
      context: ..
      dockerfile: bios-multilevel-platform-services/prediction/Dockerfile
    env_file:
      - ../.env
    environment:
      PREDICTION_PORT: "8091"
      BIOS_OUTPUT_DIR: /app/output
      PREDICTION_DB_PATH: /data/prediction-store.json
      PREDICTION_TARGETS: "${PREDICTION_TARGETS:-auto}"
      PREDICTION_STATIONS: "${PREDICTION_STATIONS:-OS1BIOS,OS2BIOS,SOLAXBIOS}"
      PREDICTION_INIT_MODE: "${PREDICTION_INIT_MODE:-resume}"
      PREDICTION_BACKFILL_HOURS: "${PREDICTION_BACKFILL_HOURS:-72}"
      PREDICTION_EXPECTED_SAMPLE_MINUTES: "${PREDICTION_EXPECTED_SAMPLE_MINUTES:-10}"
      PREDICTION_MIN_SAMPLES: "${PREDICTION_MIN_SAMPLES:-6}"
      PREDICTION_STALE_AFTER_MINUTES: "${PREDICTION_STALE_AFTER_MINUTES:-30}"
      PREDICTION_MISSING_RATIO_WARN: "${PREDICTION_MISSING_RATIO_WARN:-0.3}"
      SLA_TARGET_PERCENT: "${SLA_TARGET_PERCENT:-95}"
      NOTIFICATIONS_ENABLED: "${NOTIFICATIONS_ENABLED:-false}"
      NOTIFICATION_WEBHOOK_URL: "${NOTIFICATION_WEBHOOK_URL:-}"
      NOTIFICATION_STALE_AFTER_MINUTES: "${NOTIFICATION_STALE_AFTER_MINUTES:-60}"
      NOTIFICATION_REPEAT_AFTER_MINUTES: "${NOTIFICATION_REPEAT_AFTER_MINUTES:-240}"
      PREDICTION_DATA_API_BASE: "${PREDICTION_DATA_API_BASE:-}"
      WEATHER_API_BASE: "${WEATHER_API_BASE:-}"
      WEATHER_API_KEY: "${WEATHER_API_KEY:-}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://bios:bios@postgres:5432/bios}"
    volumes:
      - ../output:/app/output:ro
      - prediction-data:/data
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  blockchain:
    build:
      context: ..
      dockerfile: bios-multilevel-platform-services/blockchain/Dockerfile
    env_file:
      - ../.env
    environment:
      BLOCKCHAIN_PORT: "8092"
      BLOCKCHAIN_DB_PATH: /data/blockchain-store.json
      BLOCKCHAIN_EVENT_FILTERS: "${BLOCKCHAIN_EVENT_FILTERS:-data_batch_seen,data_quality_changed,prediction_generated,anomaly_detected,sla_breached,sla_recovered,export_file_refreshed,ok,alarm,export,config,critical_measurement}"
      BLOCKCHAIN_MAX_RETRIES: "${BLOCKCHAIN_MAX_RETRIES:-3}"
      BLOCKCHAIN_WALLET_SEED: "${BLOCKCHAIN_WALLET_SEED:-development-seed-change-me}"
      BLOCKCHAIN_AMQP_MODE: "${BLOCKCHAIN_AMQP_MODE:-off}"
      BLOCKCHAIN_INIT_MODE: "${BLOCKCHAIN_INIT_MODE:-resume}"
      BLOCKCHAIN_INTERVAL_SECONDS: "${BLOCKCHAIN_INTERVAL_SECONDS:-10}"
      BLOCKCHAIN_RECONFIRM_SECONDS: "${BLOCKCHAIN_RECONFIRM_SECONDS:-20}"
      BLOCKCHAIN_EVENT_SOURCE: "${BLOCKCHAIN_EVENT_SOURCE:-prediction}"
      BLOCKCHAIN_EVENT_SCHEMA: "${BLOCKCHAIN_EVENT_SCHEMA:-v2}"
      BLOCKCHAIN_ANCHOR_PREDICTIONS: "${BLOCKCHAIN_ANCHOR_PREDICTIONS:-false}"
      BLOCKCHAIN_DEMO_DEVICES: "${BLOCKCHAIN_DEMO_DEVICES:-0x0A1C}"
      BLOCKCHAIN_MAX_BROADCASTS_PER_CYCLE: "${BLOCKCHAIN_MAX_BROADCASTS_PER_CYCLE:-3}"
      BLOCKCHAIN_SHOW_VENDOR_WARNINGS: "${BLOCKCHAIN_SHOW_VENDOR_WARNINGS:-false}"
      PREDICTION_SERVICE_URL: http://prediction:8091
      STEALTH_RELAY_MODE: "${STEALTH_RELAY_MODE:-json-rpc}"
      STEALTH_RPC_URL: "${STEALTH_RPC_URL:-https://api-gateway-mainnet.stealthmonitor.xyz}"
      STEALTH_RPC_ID: "${STEALTH_RPC_ID:-666420}"
      STEALTH_RPC_USERNAME: "${STEALTH_RPC_USERNAME:-}"
      STEALTH_RPC_PASSWORD: "${STEALTH_RPC_PASSWORD:-}"
      STEALTH_API_KEY: "${STEALTH_API_KEY:-}"
      STEALTH_RPC_STATUS_METHOD: "${STEALTH_RPC_STATUS_METHOD:-getinfo}"
      STEALTH_RPC_BALANCE_METHOD: "${STEALTH_RPC_BALANCE_METHOD:-getaddressbalance}"
      STEALTH_RPC_OUTPUTS_METHOD: "${STEALTH_RPC_OUTPUTS_METHOD:-getaddressoutputs}"
      STEALTH_RPC_TX_METHOD: "${STEALTH_RPC_TX_METHOD:-gettransaction}"
      STEALTH_RPC_BLOCK_METHOD: "${STEALTH_RPC_BLOCK_METHOD:-getblock}"
      STEALTH_RPC_BEST_BLOCK_METHOD: "${STEALTH_RPC_BEST_BLOCK_METHOD:-getbestblock}"
      STEALTH_RPC_SEND_METHOD: "${STEALTH_RPC_SEND_METHOD:-sendrawtransaction}"
      STEALTH_WIF_FILE: "${STEALTH_WIF_FILE:-/run/secrets/stealth-wif}"
      STEALTH_WALLET_SEED_FILE: "${STEALTH_WALLET_SEED_FILE:-}"
      STEALTH_RAW_TX_BUILDER_URL: "${STEALTH_RAW_TX_BUILDER_URL:-}"
      STEALTH_FEEWORK_TIMEOUT_SECONDS: "${STEALTH_FEEWORK_TIMEOUT_SECONDS:-120}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://bios:bios@postgres:5432/bios}"
    extra_hosts:
      # Same idea as Kubernetes hostAliases: use cert-valid stealthmonitor.xyz hostname while
      # connecting to the Barrage-internal gateway VIP (adjust IP if infra changes).
      - "api-gateway-mainnet.stealthmonitor.xyz:172.21.239.244"
    volumes:
      - blockchain-data:/data
      - ../secrets/stealth-wif.txt:/run/secrets/stealth-wif:ro
    ports:
      - "8092:8092"
    depends_on:
      - prediction
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: bios-multilevel-platform-services/dashboard/Dockerfile
    environment:
      PREDICTION_SERVICE_URL: http://prediction:8091
      BLOCKCHAIN_SERVICE_URL: http://blockchain:8092
      DASHBOARD_EVENT_POLL_SECONDS: "${DASHBOARD_EVENT_POLL_SECONDS:-2}"
    depends_on:
      - prediction
      - blockchain
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "deno", "eval", "const r=await fetch('http://localhost:8000/health'); Deno.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  prediction-data:
  blockchain-data:
