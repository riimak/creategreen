# Prediction service — internal ClusterIP only (no public ingress).
# Two replicas on different nodes; a PostgreSQL advisory lock elects the one
# that runs the cycle scheduler, the other serves reads and takes over within
# PREDICTION_LEADER_CHECK_SECONDS when the leader disappears (server.js).
replicaCount: 2
strategyType: "RollingUpdate"
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app: bios-prediction-production

image:
  repository: git.barrage.net/bios-multilevel/bios-multilevel-dashboard
  tag: stable
  pullPolicy: IfNotPresent
  secrets:
    # CI job token: valid only while the deploy job runs, so a pod rescheduled
    # later cannot pull with it. The deploy-token secret below is created once
    # by hand from a GitLab deploy token with read_registry (see
    # docs/runbook-production.md) and keeps pulls working between pipelines.
    - name: gitlab-registry-bios-multilevel-bios-multilevel-dashboard
    - name: bios-registry-deploy-token

application:
  track: stable
  tier: app

barrage:
  vault:
    create: false

service:
  enabled: true
  name: bios-pred
  type: ClusterIP
  externalPort: 8091
  internalPort: 8091

ingress:
  enabled: false
  path: "/"
  tls:
    enabled: false

livenessProbe:
  path: "/health"
  initialDelaySeconds: 15
  timeoutSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"

readinessProbe:
  path: "/health"
  initialDelaySeconds: 5
  timeoutSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"

startupProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30
  periodSeconds: 5
  scheme: "HTTP"
  probeType: "httpGet"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

postgresql:
  managed: false

persistence:
  enabled: false

extraVolumes:
  - name: pg-ca
    secret:
      secretName: bios-pg-ca
      optional: true
extraVolumeMounts:
  - name: pg-ca
    mountPath: /etc/ssl/pg
    readOnly: true

serviceAccount:
  name: bios-multilevel-sa
  annotations: {}
  createNew: true

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false

extraEnv:
  - name: PREDICTION_PORT
    value: "8091"
  - name: PREDICTION_INTERVAL_MINUTES
    value: "10"
  - name: PREDICTION_TARGETS
    value: "auto"
  # OS1BIOS is not listed: Mars2 has returned zero rows for it since April 2026
  # (every cycle logged rows=0), so it only produced a permanent "no
  # measurements" alert. Re-add it here once the station reports again.
  - name: PREDICTION_STATIONS
    value: "OS2BIOS,SOLAXBIOS"
  - name: PREDICTION_INIT_MODE
    value: "resume"
  - name: PREDICTION_BACKFILL_HOURS
    value: "72"
  - name: PREDICTION_EXPECTED_SAMPLE_MINUTES
    value: "10"
  - name: PREDICTION_MIN_SAMPLES
    value: "6"
  - name: PREDICTION_STALE_AFTER_MINUTES
    value: "30"
  - name: PREDICTION_MISSING_RATIO_WARN
    value: "0.3"
  - name: SLA_TARGET_PERCENT
    value: "95"
  - name: DATABASE_CA_FILE
    value: "/etc/ssl/pg/ca.crt"
  # Self-healing: a cycle running longer than this makes /health return 503 so
  # the liveness probe restarts the container (a wedged cycle once went
  # unnoticed for a week). Mars2 calls get a hard deadline for the same reason.
  - name: PREDICTION_CYCLE_DEADLINE_MINUTES
    value: "30"
  - name: BIOS_API_TIMEOUT_MS
    value: "30000"
  # Feed API for Mars2 (prediction/feed.js): plant code -> our source key. The
  # codes are the Mars2 "Mjerno mjesto" codes the partner will pull as
  # CustomDataExport/BIOS/<code>. Credentials (FEED_USERNAME/FEED_PASSWORD or
  # FEED_API_KEY) come from GitLab CI variables; without them the feed is 503.
  - name: FEED_PLANTS
    value: "SOKO46BIOS=HUAWEI:NE=201410062,SOKOBAZENBIOS=HUAWEI:NE=201791758,VETINSTBIOS=SOLIS:1298491919450654168"
  # Mars2 / BIOS API ingest. Without these three set, `loadRecords` falls back to
  # local export files which don't exist in the pod → 0 targets, no Mars2 logs, blank dashboard.
  # `BIOS_API_BASE` is committed (not a secret); `BIOS_USERNAME`/`BIOS_PASSWORD` are appended
  # to this file from GitLab CI variables in `production-prediction.before_script`
  # (see `.gitlab-ci.yml`).
  - name: BIOS_API_BASE
    value: "http://web.mars2.barrage.net:81"
