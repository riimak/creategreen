<!DOCTYPE html>
<!-- CREATEGREEN BIOS Dashboard
     Visual demonstration of the Mars2 API and data pipeline.
     Served via GitHub Pages from the docs/ directory.
     This is NOT documentation — it is the live public dashboard. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATEGREEN BIOS Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d29;--card:#252836;--border:#2e3148;
  --text:#e4e6f0;--muted:#8b8fa3;--accent:#3b82f6;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#06b6d4;
  --purple:#a855f7;--pink:#ec4899;
  --radius:12px;
}
html{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;padding:0}

header{
  position:sticky;top:0;z-index:50;
  background:rgba(15,17,23,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:1rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;
}
header h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
header h1 span{color:var(--green);font-weight:400}
.header-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.range-btns{display:flex;gap:2px;background:var(--card);border-radius:8px;padding:2px}
.range-btns button{
  background:none;border:none;color:var(--muted);font-size:.8rem;font-weight:500;
  padding:.4rem .9rem;border-radius:6px;cursor:pointer;transition:all .15s;
}
.range-btns button:hover{color:var(--text)}
.range-btns button.active{background:var(--accent);color:#fff}

main{max-width:1440px;margin:0 auto;padding:1.5rem}

.section-title{
  font-size:1rem;font-weight:600;margin-bottom:1rem;
  display:flex;align-items:center;gap:.5rem;
}
.section-title::before{
  content:'';width:4px;height:1.2em;border-radius:2px;
}
.meteo-title::before{background:var(--cyan)}
.solar-title::before{background:var(--amber)}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:.75rem;margin-bottom:1.25rem;
}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1rem;transition:border-color .2s;
}
.kpi:hover{border-color:var(--accent)}
.kpi-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.kpi-value{font-size:1.5rem;font-weight:700;line-height:1.2}
.kpi-unit{font-size:.75rem;color:var(--muted);font-weight:400;margin-left:.15rem}
.kpi-sub{font-size:.65rem;color:var(--muted);margin-top:.25rem}

.charts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
  gap:1rem;margin-bottom:2rem;
}
.chart-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1rem;
}
.chart-card h3{font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:.75rem}
.chart-card canvas{width:100%!important;height:250px!important}

.loading-overlay{
  position:fixed;inset:0;background:var(--bg);display:flex;
  align-items:center;justify-content:center;z-index:100;
  transition:opacity .4s;
}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.error-bar{
  background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:8px;
  padding:.75rem 1rem;margin-bottom:1rem;color:var(--red);font-size:.85rem;display:none;
}

.station-tabs{display:flex;gap:2px;background:var(--card);border-radius:8px;padding:2px;margin-bottom:1rem}
.station-tabs button{
  background:none;border:none;color:var(--muted);font-size:.8rem;font-weight:500;
  padding:.4rem .9rem;border-radius:6px;cursor:pointer;transition:all .15s;
}
.station-tabs button:hover{color:var(--text)}
.station-tabs button.active{background:var(--cyan);color:#fff}

footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border)}

@media(max-width:640px){
  .charts-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  header{padding:.75rem 1rem}
  main{padding:1rem}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loader"><div class="spinner"></div></div>

<header>
  <h1>CREATEGREEN <span>BIOS</span></h1>
  <div class="header-right">
    <div class="status">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
    <div class="range-btns" id="rangeButtons">
      <button data-hours="6">6h</button>
      <button data-hours="24" class="active">24h</button>
      <button data-hours="72">72h</button>
    </div>
  </div>
</header>

<main>
  <div class="error-bar" id="errorBar"></div>

  <div class="section-title meteo-title">Meteo Stations</div>
  <div class="station-tabs" id="meteoTabs">
    <button class="active" data-station="OS1BIOS">OS1 BIOS (Kapelska)</button>
    <button data-station="OS2BIOS">OS2 BIOS (Hadrijana)</button>
  </div>
  <div class="kpi-grid" id="meteoKpis"></div>
  <div class="charts-grid" id="meteoCharts">
    <div class="chart-card"><h3>Temperature & Humidity</h3><canvas id="chartTempHum"></canvas></div>
    <div class="chart-card"><h3>Solar Radiation</h3><canvas id="chartSolar"></canvas></div>
    <div class="chart-card"><h3>Air Quality (PM2.5 / PM10 / O3)</h3><canvas id="chartAirQ"></canvas></div>
  </div>

  <div class="section-title solar-title">Solar Inverter (SOLAXBIOS)</div>
  <div class="kpi-grid" id="solaxKpis"></div>
  <div class="charts-grid" id="solaxCharts">
    <div class="chart-card"><h3>Grid Power & AC Output</h3><canvas id="chartGrid"></canvas></div>
    <div class="chart-card"><h3>Daily Energy Production</h3><canvas id="chartEnergy"></canvas></div>
  </div>
</main>

<footer>CREATEGREEN BIOS Dashboard &middot; Data from Mars2 Platform &middot; Auto-refreshes every 5 min</footer>

<script>
// ── Config ──────────────────────────────────────────────────────────
const WORKER_URL = 'https://creategreen-api.management-ec5.workers.dev';
const REFRESH_MS = 5 * 60 * 1000;

let currentHours = 24;
let activeMeteo = 'OS1BIOS';
let charts = {};
let allData = {};

// ── DOM refs ────────────────────────────────────────────────────────
const $loader = document.getElementById('loader');
const $error = document.getElementById('errorBar');
const $status = document.getElementById('statusText');
const $dot = document.getElementById('statusDot');

// ── API ─────────────────────────────────────────────────────────────
async function fetchStation(station, hours) {
  const res = await fetch(`${WORKER_URL}/api?station=${station}&hours=${hours}`);
  if (!res.ok) throw new Error(`${station}: HTTP ${res.status}`);
  return res.json();
}

async function fetchAll() {
  try {
    $error.style.display = 'none';
    const [os1, os2, solax] = await Promise.all([
      fetchStation('OS1BIOS', currentHours),
      fetchStation('OS2BIOS', currentHours),
      fetchStation('SOLAXBIOS', currentHours),
    ]);
    allData = { OS1BIOS: os1, OS2BIOS: os2, SOLAXBIOS: solax };
    render();
    $status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    $dot.style.background = 'var(--green)';
  } catch (e) {
    $error.textContent = `Error: ${e.message}`;
    $error.style.display = 'block';
    $dot.style.background = 'var(--red)';
    $status.textContent = 'Connection error';
  } finally {
    $loader.classList.add('hidden');
  }
}

// ── Rendering ───────────────────────────────────────────────────────
function last(data, field) {
  if (!data?.data) return null;
  for (let i = data.data.length - 1; i >= 0; i--) {
    const v = data.data[i][field];
    if (v !== null && v !== undefined) return v;
  }
  return null;
}

function fmt(v, decimals = 1) {
  if (v === null || v === undefined) return '--';
  return Number(v).toFixed(decimals);
}

function kpi(label, value, unit, sub) {
  return `<div class="kpi">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}<span class="kpi-unit">${unit}</span></div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
}

function renderMeteoKpis() {
  const d = allData[activeMeteo];
  if (!d) return;
  document.getElementById('meteoKpis').innerHTML = [
    kpi('Temperature', fmt(last(d, 'Temperatura')), '°C'),
    kpi('Humidity', fmt(last(d, 'Relativna vlaznost'), 0), '%'),
    kpi('Pressure', fmt(last(d, 'Tlak zraka')), 'kPa'),
    kpi('Solar Radiation', fmt(last(d, 'Suncevo zracenje'), 0), 'W/m²'),
    kpi('UV Index', fmt(last(d, 'UV indeks'), 0), ''),
    kpi('Rain', fmt(last(d, 'Kisa'), 2), 'mm/min'),
    kpi('PM2.5', fmt(last(d, 'Lebdece cestice PM2.5')), 'μg/m³'),
    kpi('PM10', fmt(last(d, 'Lebdece cestice PM10')), 'μg/m³'),
    kpi('CO2', fmt(last(d, 'CO2'), 0), ''),
    kpi('Noise', fmt(last(d, 'Buka')), 'dB'),
  ].join('');
}

function renderSolaxKpis() {
  const d = allData.SOLAXBIOS;
  if (!d) return;
  document.getElementById('solaxKpis').innerHTML = [
    kpi('Grid Power', fmt(last(d, 'Grid.power.total'), 2), 'kW'),
    kpi('AC Output', fmt(last(d, 'Inverter.AC.power.total'), 2), 'kW'),
    kpi('Daily Energy', fmt(last(d, 'Inverter.AC.energy.out.daily'), 1), 'kWh'),
    kpi('To Grid (total)', fmt(last(d, 'Grid.energy.toGrid.total'), 0), 'kWh'),
    kpi('From Grid (total)', fmt(last(d, 'Grid.energy.fromGrid.total'), 0), 'kWh'),
  ].join('');
}

// ── Charts ──────────────────────────────────────────────────────────
const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: false,
  animation: { duration: 400 },
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { position: 'top', labels: { color: '#8b8fa3', font: { size: 11, family: 'Inter' }, boxWidth: 12, padding: 12 } },
    tooltip: { backgroundColor: '#252836', titleColor: '#e4e6f0', bodyColor: '#e4e6f0', borderColor: '#2e3148', borderWidth: 1, padding: 10 },
  },
  scales: {
    x: {
      type: 'time', time: { tooltipFormat: 'MMM d, HH:mm' },
      grid: { color: 'rgba(46,49,72,.5)' }, ticks: { color: '#8b8fa3', font: { size: 10 }, maxTicksLimit: 8 },
    },
    y: {
      grid: { color: 'rgba(46,49,72,.5)' }, ticks: { color: '#8b8fa3', font: { size: 10 } },
      position: 'left',
    },
  },
};

function ts(data, field) {
  if (!data?.data) return { labels: [], values: [] };
  const pts = [];
  for (const r of data.data) {
    if (r[field] !== null && r[field] !== undefined) {
      pts.push({ x: new Date(r.timestamp * 1000), y: r[field] });
    }
  }
  return pts;
}

function makeDataset(label, data, color, yAxisID, fill) {
  return {
    label, data, borderColor: color, backgroundColor: fill || color + '18',
    borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: !!fill,
    yAxisID: yAxisID || 'y',
  };
}

function buildChart(canvasId, datasets, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (charts[canvasId]) charts[canvasId].destroy();

  const config = JSON.parse(JSON.stringify(CHART_DEFAULTS));
  if (opts.y2) {
    config.scales.y2 = {
      ...config.scales.y,
      position: 'right',
      grid: { drawOnChartArea: false, color: 'rgba(46,49,72,.5)' },
    };
  }

  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: config,
  });
}

function renderMeteoCharts() {
  const d = allData[activeMeteo];
  if (!d) return;

  buildChart('chartTempHum', [
    makeDataset('Temperature (°C)', ts(d, 'Temperatura'), '#ef4444', 'y', '#ef444418'),
    makeDataset('Humidity (%)', ts(d, 'Relativna vlaznost'), '#3b82f6', 'y2', '#3b82f618'),
  ], { y2: true });

  buildChart('chartSolar', [
    makeDataset('Solar Radiation (W/m²)', ts(d, 'Suncevo zracenje'), '#f59e0b', 'y', '#f59e0b18'),
  ]);

  buildChart('chartAirQ', [
    makeDataset('PM2.5 (μg/m³)', ts(d, 'Lebdece cestice PM2.5'), '#a855f7'),
    makeDataset('PM10 (μg/m³)', ts(d, 'Lebdece cestice PM10'), '#ec4899'),
    makeDataset('O3 (μg/m³)', ts(d, 'O3'), '#06b6d4'),
  ]);
}

function renderSolaxCharts() {
  const d = allData.SOLAXBIOS;
  if (!d) return;

  buildChart('chartGrid', [
    makeDataset('Grid Power (kW)', ts(d, 'Grid.power.total'), '#22c55e', 'y', '#22c55e18'),
    makeDataset('AC Output (kW)', ts(d, 'Inverter.AC.power.total'), '#f59e0b', 'y2'),
  ], { y2: true });

  buildChart('chartEnergy', [
    makeDataset('Daily Energy (kWh)', ts(d, 'Inverter.AC.energy.out.daily'), '#3b82f6', 'y', '#3b82f618'),
  ]);
}

function render() {
  renderMeteoKpis();
  renderSolaxKpis();
  renderMeteoCharts();
  renderSolaxCharts();
}

// ── Event handlers ──────────────────────────────────────────────────
document.getElementById('rangeButtons').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#rangeButtons button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentHours = parseInt(e.target.dataset.hours, 10);
  fetchAll();
});

document.getElementById('meteoTabs').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#meteoTabs button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeMeteo = e.target.dataset.station;
  renderMeteoKpis();
  renderMeteoCharts();
});

// ── Init ────────────────────────────────────────────────────────────
fetchAll();
setInterval(fetchAll, REFRESH_MS);
</script>
</body>
</html>
