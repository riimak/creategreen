# Stations the partner (PMF NS) pulls from Mars2 as CustomDataExport/BIOS/<ID>.
# One station per line:  ID|layout
#   meteo  21 measurement columns (OS1BIOS/OS2BIOS layout, specs/os1bios-measurements.txt)
#   solar  15 measurement columns (SOLAXBIOS layout, specs/solaxbios-measurements.txt);
#          the monthly report is produced for every solar station.
# Lines starting with # are ignored. Override the file with BIOS_STATIONS_FILE.

# Meteo stations
OS1BIOS|meteo
OS2BIOS|meteo

# Solar plants
SOLAXBIOS|solar
SOKO46|solar
SOKOBAZEN|solar
VETINST|solar

# Dvorana Kulturnog centra (Solarman logger) has the Mars2 station code
# "Solarman" but none of its variables carries a CustomExport position, so
# CustomDataExport/BIOS/Solarman returns no rows. Enable once that is mapped
# in Mars2 (docs/mars2/admin-recon.md, section 4).
#Solarman|solar
